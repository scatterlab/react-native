name: '[scatterlab] Build Android prebuilt'

# Builds com.facebook.react:* from THIS fork's sources and attaches the resulting Maven
# repository to a `prebuilt-android-<version>` release.
#
# Why this exists: RNGP force-resolves com.facebook.react:react-android:<VERSION_NAME> from
# Maven Central and VERSION_NAME must stay on the upstream base, so a consumer never compiles
# the fork's ReactAndroid sources. Consumed by
# packages/react-native/scripts/android/scatterlab-prebuilt-maven.gradle.
#
# Runners: the org has an IP allow list and GitHub-hosted runners are not on it, so every
# authenticated api.github.com write from a hosted runner fails with HTTP 403.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork version the artifacts are for, e.g. 0.87.1-scatterlab.3'
        required: true
        type: string
      verify_symbol:
        description: 'Identifier this version introduces, asserted to be absent from the upstream base AAR and present in the one built here (e.g. visibleTextEnd). Required for a real release. Pass the literal (none) - parentheses make it something no identifier can be - only for a release that genuinely adds no new symbol, such as a bare base bump.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build and verify only, do not create a release'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # Two dispatches for the same version race over a single draft release: the second deletes
  # the first's draft and uploads its own assets, and the first's `verify` then promotes
  # artifacts it never built - possibly from a different ref. Queue rather than cancel: a run
  # killed mid-flight can leave assets uploaded and the draft unpromoted, which is worse than
  # a run that waits.
  group: scatterlab-prebuild-android-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: arc-messenger-dev
    permissions:
      contents: write
    outputs:
      base: ${{ steps.v.outputs.base }}
      tag: ${{ steps.v.outputs.tag }}
      asset: ${{ steps.v.outputs.asset }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate versions
        id: v
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERIFY_SYMBOL: ${{ inputs.verify_symbol }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-scatterlab\.[0-9]+$ ]]; then
            echo "::error::version must look like 0.87.1-scatterlab.3"
            exit 1
          fi
          BASE="${VERSION%-scatterlab.*}"

          # The patch-presence gate in `build` is the only evidence that a release's artifacts
          # came from the sources its version claims - every fork version publishes the
          # identical Maven coordinate. Accepting the dispatch form's defaults must therefore
          # not turn it off: an empty value fails a real release, and opting out has to be
          # spelled out.
          if [ "$DRY_RUN" != "true" ] && [ -z "$VERIFY_SYMBOL" ]; then
            echo "::error::verify_symbol is required for a real release. Pass the identifier this version introduces, or the literal (none) if it genuinely adds no new symbol."
            exit 1
          fi

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tag=prebuilt-android-$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=react-native-android-maven-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"

          # The AAR coordinate carries the base, not the fork version, so this is the only
          # place the two are checked against each other.
          GRADLE_VERSION=$(sed -n 's/^VERSION_NAME=//p' packages/react-native/ReactAndroid/gradle.properties)
          if [ "$GRADLE_VERSION" != "$BASE" ]; then
            echo "::error::ReactAndroid/gradle.properties VERSION_NAME is '$GRADLE_VERSION', expected the upstream base '$BASE'."
            exit 1
          fi

          # Unlike VERSION_NAME above, this is inputs.dry_run-conditional: iOS warns in both
          # cases because its tarball is named per version, which is itself a signal that
          # the artifact matches. Android has no such signal - the coordinate is identical
          # across all fork versions (see "좌표 충돌" in android-prebuilt.md) - so a real
          # release build must fail closed here, not just warn.
          COMMITTED=$(node -p "require('./packages/react-native/package.json').version")
          if [ "$COMMITTED" != "$VERSION" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::packages/react-native/package.json is at $COMMITTED but these artifacts are for $VERSION. They must match the version consumers install, or the URL the consumer script builds will not resolve."
            else
              echo "::error::packages/react-native/package.json is at $COMMITTED but these artifacts are for $VERSION. A real release must be built from the checkout that matches $VERSION, or the consumer downloads this tag and gets the wrong binaries."
              exit 1
            fi
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # The only automated coverage of the consumer script's fail-closed behavior (no-op on
      # upstream, abort on a missing release, warm-cache reuse with no network). This is what
      # stops an unpatched AAR shipping silently, so it runs on every release build - cheap,
      # Linux-only, no Android SDK needed.
      - name: Run the consumer script smoke test
        run: .github/scatterlab/__tests__/android-prebuilt-consumer-test.sh

  build:
    needs: prepare
    runs-on: arc-messenger-dev
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup git safe folders
        run: git config --global --add safe.directory '*'

      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/yarn-install

      # Without a warm ccache every run is a full C++ rebuild of ReactCommon.
      - name: Restore the Android ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: scatterlab-ccache-android-${{ hashFiles('packages/react-native/ReactAndroid/**/*.cpp', 'packages/react-native/ReactAndroid/**/*.h', 'packages/react-native/ReactCommon/**/*.cpp', 'packages/react-native/ReactAndroid/**/CMakeLists.txt', 'packages/react-native/ReactCommon/**/CMakeLists.txt') }}
          restore-keys: scatterlab-ccache-android-

      # The upstream .github/actions/build-android composite is deliberately NOT reused: it
      # runs scripts/releases/set-rn-artifacts-version.js, which rewrites VERSION_NAME and
      # breaks the coordinate the consumer resolves.
      - name: Build and publish the Android artifacts to /tmp/maven-local
        run: |
          set -euo pipefail
          rm -rf /tmp/maven-local
          # useHermesStable keeps Hermes off this build: com.facebook.hermes is a different
          # publishing group, so it still resolves from Maven Central on the consumer side.
          # isSnapshot stays off - it would append -SNAPSHOT to the coordinate.
          env ORG_GRADLE_PROJECT_react.internal.useHermesStable=true \
            ./gradlew publishAllToMavenTempLocal -PenableWarningsAsErrors=true

      - name: Assert the Maven tree is complete
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail
          DIR="/tmp/maven-local/com/facebook/react/react-android/$BASE"
          for f in "react-android-$BASE-debug.aar" "react-android-$BASE-release.aar" \
                   "react-android-$BASE.module" "react-android-$BASE.pom"; do
            [ -f "$DIR/$f" ] || { echo "::error::$DIR/$f is missing"; exit 1; }
          done

      - name: Assert the patch is in the built AAR and not in the upstream one
        if: ${{ inputs.verify_symbol != '' && inputs.verify_symbol != '(none)' }}
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          SYMBOL: ${{ inputs.verify_symbol }}
        run: |
          set -euo pipefail
          # Every fork version publishes the same coordinate, so "the artifact exists" proves
          # nothing about which sources went into it. Neither does "the symbol is in our AAR"
          # on its own: a typo, or an identifier upstream already has, passes that with no
          # patch present. What means something is the pair - absent upstream, present here.
          WORK=$(mktemp -d)

          # Sets COUNT to the number of disassembly lines mentioning $SYMBOL in AAR $1.
          count_symbol() {
            local aar=$1 label=$2 dir disasm status
            dir="$WORK/$label"
            mkdir -p "$dir/classes"
            unzip -q "$aar" classes.jar -d "$dir"
            unzip -q "$dir/classes.jar" -d "$dir/classes"

            # A broken javap (missing JDK, corrupt classes) would otherwise converge to the
            # same COUNT=0 as "the symbol really isn't there". Check the disassembly itself
            # ran before trusting a zero count.
            set +e
            disasm=$(find "$dir/classes" -name '*.class' -exec javap -p {} + 2>"$dir/javap.err")
            status=$?
            set -e
            if [ "$status" -ne 0 ] || [ -z "$disasm" ]; then
              echo "::error::javap failed to disassemble the $label AAR's classes (exit $status) - that is a broken toolchain, not evidence '$SYMBOL' is missing"
              cat "$dir/javap.err" >&2
              exit 1
            fi
            COUNT=$(printf '%s\n' "$disasm" | grep -cF "$SYMBOL" || true)
          }

          # The baseline. One extra download on the release path, and the only thing that
          # makes a non-zero count below mean "this fork added it" rather than "it was
          # always there".
          curl -fsSL --retry 3 -o "$WORK/upstream.aar" \
            "https://repo1.maven.org/maven2/com/facebook/react/react-android/$BASE/react-android-$BASE-release.aar"
          count_symbol "$WORK/upstream.aar" upstream
          echo "'$SYMBOL' occurrences in the upstream $BASE release AAR: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "::error::'$SYMBOL' is already in the upstream $BASE AAR, so finding it in ours proves nothing about this fork's patch. Pass an identifier this version introduces."; exit 1; }

          count_symbol "/tmp/maven-local/com/facebook/react/react-android/$BASE/react-android-$BASE-release.aar" fork
          echo "'$SYMBOL' occurrences in the built release AAR: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "::error::'$SYMBOL' is not in the built AAR - the sources that went in are not the ones you think"; exit 1; }
          rm -rf "$WORK"

      - name: Warn if the patch-presence gate was skipped
        if: ${{ inputs.verify_symbol == '' || inputs.verify_symbol == '(none)' }}
        run: |
          echo "::warning::verify_symbol is empty or (none), so this build skips the only check that proves this version's patch is in the built AAR. Every fork version publishes the same Maven coordinate - 'the artifact exists' proves nothing about which sources went in. A real release cannot leave it empty; (none) is for a release that genuinely adds no new symbol."

      - name: Pack the Maven repository
        id: pack
        env:
          ASSET: ${{ needs.prepare.outputs.asset }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/assets"
          mkdir -p "$OUT"
          # The archive root IS the repository root, so the consumer extracts straight into
          # its cache directory with no strip-components guesswork.
          tar -C /tmp/maven-local -czf "$OUT/$ASSET" .
          ( cd "$OUT" && sha256sum "$ASSET" | awk '{print $1}' > "$ASSET.sha256" )
          ls -lh "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          # Carried to `verify` so it can tie the release's asset to the archive this run
          # actually produced, rather than to whatever happens to be attached to the tag.
          echo "sha256=$(cat "$OUT/$ASSET.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload the assets as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-android-${{ inputs.version }}
          path: ${{ steps.pack.outputs.dir }}
          if-no-files-found: error

      - name: Create the release (draft) and upload the assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ inputs.version }}
          DIR: ${{ steps.pack.outputs.dir }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A published release is already visible to consumers - re-running into it
            # would upload assets nobody re-verifies, and its assets must never be
            # clobbered (a consumer with a warm cache cannot detect a replaced asset and
            # would keep the old AAR forever). Cut a new -scatterlab.N instead.
            IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::release $TAG already exists and is published. Re-running this workflow would upload into a release consumers can already see - cut a new -scatterlab.N instead."
              exit 1
            fi
            # A draft, unlike a published release, has never been consumer-visible - its
            # asset URLs 404 for anyone without push access - so replacing it is safe. A
            # re-run lands here when an earlier run uploaded assets and then `verify`
            # failed. Delete and recreate rather than reusing it in place, so no asset from
            # that partial earlier run (e.g. only the debug AAR made it up) can survive.
            gh release delete "$TAG" --yes
          fi
          # Draft: invisible to anyone without push access, and its asset URLs 404 for
          # everyone else. A consumer that races this window gets a 404 and aborts - the
          # correct fail-closed outcome until the verify job promotes it below.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Android prebuilt for $VERSION" \
            --notes "com.facebook.react Maven artifacts built from this fork for @scatterlab/react-native@$VERSION. Consumed by scripts/android/scatterlab-prebuilt-maven.gradle." \
            --prerelease --draft
          gh release upload "$TAG" "$DIR"/*

      - name: Save the Android ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: scatterlab-ccache-android-${{ hashFiles('packages/react-native/ReactAndroid/**/*.cpp', 'packages/react-native/ReactAndroid/**/*.h', 'packages/react-native/ReactCommon/**/*.cpp', 'packages/react-native/ReactAndroid/**/CMakeLists.txt', 'packages/react-native/ReactCommon/**/CMakeLists.txt') }}

      # A shared runner: the build products are several GB.
      - name: Clean the build products
        if: always()
        run: rm -rf /tmp/maven-local

  verify:
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: arc-messenger-dev
    permissions:
      contents: write
    steps:
      - name: Assert the release is consumable, then publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job runs without actions/checkout - it needs no working tree - but
          # `gh release view/download/edit` resolve the repository from the current
          # directory's git remote and would abort with "could not determine base
          # repository". GH_REPO overrides that resolution for commands that otherwise
          # operate on a local repository (`gh help environment`).
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ needs.prepare.outputs.asset }}
          BASE: ${{ needs.prepare.outputs.base }}
          BUILT_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          # The REST "get a release by tag" endpoint (`gh api repos/.../releases/tags/<tag>`)
          # only resolves published releases - it 404s on a draft. `gh release view` falls
          # back to a GraphQL lookup that finds drafts by tag too, so use that instead.
          #
          # GitHub rewrites asset names containing unexpected characters, so compare exactly
          # rather than trusting the upload.
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/actual
          printf '%s\n%s\n' "$ASSET" "$ASSET.sha256" | sort > /tmp/expected
          diff /tmp/expected /tmp/actual

          # The checks in this job are otherwise self-consistent - any well-formed archive
          # passes them - so nothing would tie what gets promoted to what `build` produced.
          # The release was created with --target "$GITHUB_SHA", so a different value means
          # a different run's draft is sitting on this tag.
          TARGET=$(gh release view "$TAG" --json targetCommitish -q .targetCommitish)
          if [ "$TARGET" != "$GITHUB_SHA" ]; then
            echo "::error::release $TAG targets $TARGET, not this run's commit $GITHUB_SHA - it was created by a different run"
            exit 1
          fi

          # The release is still a draft here, so its public releases/download/ URL 404s
          # for everyone, us included. `gh release download` goes through the authenticated
          # API asset endpoint instead, which serves draft assets to GH_TOKEN.
          DL=$(mktemp -d)
          gh release download "$TAG" --dir "$DL" -p "$ASSET" -p "$ASSET.sha256"
          EXPECTED=$(tr -d '[:space:]' < "$DL/$ASSET.sha256")
          ACTUAL=$(sha256sum "$DL/$ASSET" | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::sha256 mismatch: $EXPECTED vs $ACTUAL"; exit 1; }
          # The sidecar only proves the archive matches its own checksum. This proves it is
          # the archive this run built.
          if [ "$ACTUAL" != "$BUILT_SHA256" ]; then
            echo "::error::the $ASSET on release $TAG has sha256 $ACTUAL, but this run's build job produced $BUILT_SHA256 - the release carries someone else's artifacts"
            exit 1
          fi

          for f in "react-android-$BASE-debug.aar" "react-android-$BASE-release.aar" \
                   "react-android-$BASE.module" "react-android-$BASE.pom"; do
            tar tzf "$DL/$ASSET" "./com/facebook/react/react-android/$BASE/$f" >/dev/null \
              || { echo "::error::$f is missing from the archive"; exit 1; }
          done

          # Only now does the release become visible to consumers.
          gh release edit "$TAG" --draft=false
          echo "release $TAG is consumable"
